<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="title description">
  <title id="title">Seq 122: Rule 1, Rule 2, Rule 2, repeat</title>
  <desc id="description">Each box represents one generation. The selected rule updates all cells simultaneously. Rule 1 is followed by two applications of Rule 2, then the three-generation sequence repeats.</desc>
  <metadata>Explanatory diagram by Kazuhiro Tanimoto, licensed under CC BY 4.0. https://creativecommons.org/licenses/by/4.0/</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="218" rx="12" fill="#fff" stroke="#d1d5db"/>
  <text x="300" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#222">Seq 122</text>
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 162 100 H 225"/>
    <path d="M 372 100 H 435"/>
    <path d="M 510 134 V 178 H 90 V 136"/>
  </g>
  <rect x="18" y="66" width="144" height="68" rx="9" fill="#e4f1eb" stroke="#39745c" stroke-width="2"/>
  <rect x="228" y="66" width="144" height="68" rx="9" fill="#e6effa" stroke="#386696" stroke-width="2"/>
  <rect x="438" y="66" width="144" height="68" rx="9" fill="#e6effa" stroke="#386696" stroke-width="2"/>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#222">
    <text x="90" y="108">Rule 1</text>
    <text x="300" y="108">Rule 2</text>
    <text x="510" y="108">Rule 2</text>
  </g>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Repeat the sequence</text>
</svg>
